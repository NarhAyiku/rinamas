<script>
  // Draw QR codes as vector squares.
  function drawQr(g) {
    const qr = qrcode(0, "M"); qr.addData(g.dataset.url); qr.make();
    const n = qr.getModuleCount(), size = +g.dataset.size, cell = size / n, x0 = +g.dataset.x, y0 = +g.dataset.y;
    let d = "";
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${(x0 + c * cell).toFixed(3)} ${(y0 + r * cell).toFixed(3)}h${cell.toFixed(3)}v${cell.toFixed(3)}h-${cell.toFixed(3)}z`;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", d); p.setAttribute("fill", "#111214"); g.appendChild(p);
  }
  // Hazard stripes as plain 45° parallelograms clipped to their box (patterns get rasterised in PDFs).
  let clipN = 0;
  function stripes(g) {
    const NS = "http://www.w3.org/2000/svg";
    const x = +g.dataset.x, y = +g.dataset.y, w = +g.dataset.w, h = +g.dataset.h, p = +g.dataset.p, half = p / 2;
    const clip = document.createElementNS(NS, "clipPath"); clip.id = "hzc" + ++clipN;
    const r = document.createElementNS(NS, "rect"); r.setAttribute("x", x); r.setAttribute("y", y); r.setAttribute("width", w); r.setAttribute("height", h);
    clip.appendChild(r); g.appendChild(clip);
    const bg = r.cloneNode(); bg.setAttribute("fill", g.dataset.dark || "#111214"); g.appendChild(bg);
    let d = "";
    for (let s = x - h; s < x + w + p; s += p) d += `M${s} ${y + h}L${s + h} ${y}L${s + h + half} ${y}L${s + half} ${y + h}Z`;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d); path.setAttribute("fill", g.dataset.light || "#FFCD11"); path.setAttribute("clip-path", `url(#${clip.id})`);
    g.appendChild(path);
  }
  // Shrink any text wider than its data-fit width (mm), so nothing ever runs into a neighbour.
  function fit(t) {
    const max = +t.dataset.fit, w = t.getComputedTextLength();
    if (w > max) t.setAttribute("font-size", (parseFloat(t.getAttribute("font-size")) * max / w).toFixed(2));
  }
  window.ready = (async () => {
    const which = location.hash.slice(1) || "banner";
    document.getElementById(which).classList.add("on");
    await document.fonts.ready;
    document.querySelectorAll(".hz").forEach(stripes);
    document.querySelectorAll(".qr").forEach(drawQr);
    document.querySelectorAll(`#${which} [data-fit]`).forEach(fit);
    return which;
  })();
</script>
