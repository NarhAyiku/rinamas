# Every 15 minutes, ask rinamas.com to email staff about hire requests nobody has taken for 2 hours.
# The site only emails between 07:00 and 20:00 Accra time and only once per request; this just knocks.
# Needs the repository secret CRON_SECRET (same value as the CRON_SECRET env var on Vercel).
name: Desk alerts
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  knock:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for waiting requests
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET repository secret is not set"; exit 0; fi
          curl -sS --fail-with-body --max-time 60 -H "Authorization: Bearer $CRON_SECRET" https://rinamas.com/api/cron/alerts
